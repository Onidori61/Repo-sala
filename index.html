<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositório de Aula - Redirecionamento</title>
    
    <!-- 
        *** IMPORTANTE: VOCÊ DEVE MUDAR ESTE URL ABAIXO *** Troque "SEU_NOVO_LINK_DO_NGROK_AQUI" pelo novo endereço gerado pelo ngrok.
        O "content=0" garante o redirecionamento imediato (após 0 segundos).
    -->
    <meta http-equiv="refresh" content="0; https://applausive-lignicolous-gema.ngrok-free.dev ">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 2rem;
            border-radius: 1rem;
            background-color: #171717;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            max-width: 90%;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #0d9af2;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1 class="text-2xl font-bold mb-2">Redirecionando...</h1>
        <p class="text-gray-400">Você será enviado para o Repositório em instantes.</p>
        <p class="text-sm text-gray-500 mt-4">
            Se o redirecionamento não funcionar, <a id="fallback-link" href="#" class="text-primary hover:underline font-medium">clique aqui</a>.
        </p>
    </div>

    <script>
        // O JavaScript serve como um fallback de segurança, embora a tag <meta> seja instantânea.
        const ngrokUrl = "https://www.youtube.com/"; // Certifique-se de que este link corresponde ao link na tag <meta>

        // Configura o link de fallback
        document.getElementById('fallback-link').href = ngrokUrl;

        // Redirecionamento forçado (caso a meta tag seja bloqueada por algum motivo)
        setTimeout(() => {
            window.location.replace(ngrokUrl);
        }, 1000); // Tenta redirecionar após 1 segundo

    </script>
</body>
</html>
